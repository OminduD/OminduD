<svg xmlns="http://www.w3.org/2000/svg" width="140" height="40" viewBox="0 0 140 40" role="img" aria-label="portfolio">
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; }
    .shine { animation: shine 6s ease-in-out 1s infinite both; }
    @keyframes shine { 0% { transform: translateX(0); } 25%, 100% { transform: translateX(220px); } }
  </style>
  <defs>
    <clipPath id="b-portfolio"><rect x=".5" y=".5" width="139" height="39" rx="6"/></clipPath>
    <linearGradient id="g-portfolio" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff88" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00ff88" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00ff88" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x=".5" y=".5" width="139" height="39" rx="6" fill="#0d1320" stroke="#ffffff" stroke-opacity=".1"/>
  <g clip-path="url(#b-portfolio)">
    <rect class="shine" x="-70" y="0" width="60" height="40" fill="url(#g-portfolio)" transform="skewX(-20)"/>
  </g>
  <path d="M19 25L27 17M20 17H27V24" fill="none" stroke="#00ff88" stroke-width="2" stroke-linecap="square"/>
  <text class="mono" x="38" y="24.5" font-size="12" font-weight="700" letter-spacing="1.4" fill="#e6edf3">PORTFOLIO</text>
  <rect x=".5" y=".5" width="139" height="39" rx="6" fill="none" stroke="#00ff88" stroke-opacity=".3" stroke-width="1"/>
</svg>