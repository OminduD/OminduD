<svg xmlns="http://www.w3.org/2000/svg" width="130" height="40" viewBox="0 0 130 40" role="img" aria-label="linkedin">
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; }
    .shine { animation: shine 6s ease-in-out 1s infinite both; }
    @keyframes shine { 0% { transform: translateX(0); } 25%, 100% { transform: translateX(210px); } }
  </style>
  <defs>
    <clipPath id="b-linkedin"><rect x=".5" y=".5" width="129" height="39" rx="6"/></clipPath>
    <linearGradient id="g-linkedin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff88" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00ff88" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00ff88" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x=".5" y=".5" width="129" height="39" rx="6" fill="#0d1320" stroke="#ffffff" stroke-opacity=".1"/>
  <g clip-path="url(#b-linkedin)">
    <rect class="shine" x="-70" y="0" width="60" height="40" fill="url(#g-linkedin)" transform="skewX(-20)"/>
  </g>
  <rect x="18.75" y="13.75" width="12.5" height="12.5" rx="2" fill="none" stroke="#00ff88" stroke-width="1.5"/><text class="mono" x="25" y="23.3" text-anchor="middle" font-size="8" font-weight="700" fill="#00ff88">in</text>
  <text class="mono" x="42" y="24.5" font-size="12" font-weight="700" letter-spacing="1.4" fill="#e6edf3">LINKEDIN</text>
  <rect x=".5" y=".5" width="129" height="39" rx="6" fill="none" stroke="#00ff88" stroke-opacity=".3" stroke-width="1"/>
</svg>