name: Update Profile README

on:
  schedule:
    - cron: "0 */6 * * *"   # Run every 6 hours
  workflow_dispatch:        # Allow manual trigger
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/profile.yml'

permissions:
  contents: write

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate GitHub metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: OminduD
          base: header, activity, community, repositories, metadata
          plugin_lines: yes
          plugin_lines_sections: base
          plugin_stars: yes
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_repositories: yes
          plugin_repositories_order: featured, pinned, starred, random
          plugin_followup: yes
          plugin_followup_sections: repositories
          repositories_batch: 100
          config_timezone: UTC
          output_action: commit
          filename: github-metrics.svg
          committer_branch: main
          committer_message: "🤖 Update GitHub metrics"

      - name: Generate language stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: OminduD
          base: ""
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 10
          plugin_languages_sections: most-used, recently-used
          plugin_languages_colors: github
          plugin_languages_threshold: 0%
          config_timezone: UTC
          output_action: commit
          filename: language-stats.svg
          committer_branch: main
          committer_message: "🤖 Update language stats"

      - name: Generate achievements/trophies
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: OminduD
          base: ""
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact
          plugin_achievements_limit: 6
          config_timezone: UTC
          output_action: commit
          filename: achievements.svg
          committer_branch: main
          committer_message: "🤖 Update achievements"
