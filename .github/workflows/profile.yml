name: Update Profile README

on:
  schedule:
    - cron: "0 */6 * * *"   # Run every 6 hours
  workflow_dispatch:        # Allow manual trigger

permissions:
  contents: write

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate core metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: OminduD
          base: header, activity, community, repositories, metadata
          plugin_lines: yes
          plugin_lines_sections: base
          plugin_stars: yes
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_repositories: yes
          plugin_repositories_order: featured, pinned, starred, random
          plugin_followup: yes
          plugin_followup_sections: repositories
          repositories_batch: 100
          config_timezone: UTC
          template: classic
          theme: tokyonight
          config_display: large
          output_action: none
          filename: github-metrics.svg

      - name: Generate language stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: OminduD
          base: ""
          plugin_languages: yes
          plugin_languages_details: percentage, bytes-size
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_colors: "0:1a1b27, 1:82aaff, 2:bb9af7, 3:7aa2f7, 4:7dcfff, 5:73daca, 6:9ece6a, 7:e0af68, 8:f7768e, 9:ff9e64"
          plugin_languages_threshold: 0%
          config_display: large
          template: classic
          theme: tokyonight
          config_timezone: UTC
          output_action: none
          filename: language-stats.svg

      - name: Generate achievements/trophies
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: OminduD
          base: ""
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact
          config_display: large
          template: classic
          theme: tokyonight
          config_timezone: UTC
          output_action: none
          filename: achievements.svg

      - name: Generate contribution isocalendar
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: OminduD
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          template: classic
          theme: tokyonight
          config_timezone: UTC
          output_action: none
          filename: metrics-isocalendar.svg

      - name: Generate habits card
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: OminduD
          base: ""
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          template: classic
          theme: tokyonight
          config_timezone: UTC
          output_action: none
          filename: metrics-habits.svg

      - name: Generate follow-up card
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: OminduD
          base: ""
          plugin_followup: yes
          plugin_followup_sections: repositories, user
          template: classic
          theme: tokyonight
          config_timezone: UTC
          output_action: none
          filename: metrics-followup.svg

      - name: Generate starred topics card
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: OminduD
          base: ""
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_sort: stars
          plugin_topics_limit: 16
          template: classic
          theme: tokyonight
          config_timezone: UTC
          output_action: none
          filename: metrics-topics.svg

      - name: Generate repository licenses card
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: OminduD
          template: repository
          repo: OminduD
          base: ""
          plugin_licenses: yes
          plugin_licenses_setup: npm
          plugin_licenses_ratio: yes
          plugin_licenses_legal: yes
          theme: tokyonight
          config_timezone: UTC
          output_action: none
          filename: metrics-licenses.svg

      - name: Generate star lists card
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: OminduD
          base: ""
          plugin_starlists: yes
          plugin_starlists_limit: 2
          plugin_starlists_limit_repositories: 2
          plugin_starlists_languages: yes
          plugin_starlists_limit_languages: 8
          template: classic
          theme: tokyonight
          config_timezone: UTC
          output_action: none
          filename: metrics-starlists.svg

      - name: Generate LeetCode card
        if: ${{ vars.LEETCODE_USER != '' }}
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: OminduD
          base: ""
          plugin_leetcode: yes
          plugin_leetcode_user: ${{ vars.LEETCODE_USER }}
          plugin_leetcode_sections: solved, skills, recent
          plugin_leetcode_limit_skills: 10
          plugin_leetcode_limit_recent: 3
          template: classic
          theme: tokyonight
          config_timezone: UTC
          output_action: none
          filename: metrics-leetcode.svg

      - name: Ensure LeetCode fallback card exists
        if: ${{ vars.LEETCODE_USER == '' }}
        run: |
          cat > metrics-leetcode.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="LeetCode metrics placeholder">
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#1a1b26"/>
                <stop offset="100%" stop-color="#24283b"/>
              </linearGradient>
            </defs>
            <rect width="1200" height="600" fill="url(#bg)"/>
            <text x="60" y="120" fill="#7aa2f7" font-size="48" font-family="Segoe UI, Arial">🗳️ LeetCode Metrics</text>
            <text x="60" y="200" fill="#c0caf5" font-size="30" font-family="Segoe UI, Arial">Set repository variable LEETCODE_USER to enable this card.</text>
            <text x="60" y="255" fill="#9aa5ce" font-size="24" font-family="Segoe UI, Arial">Workflow will auto-replace this placeholder on next run.</text>
          </svg>
          EOF

      - name: Generate Stack Overflow card
        if: ${{ vars.STACKOVERFLOW_USER_ID != '' }}
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: OminduD
          base: ""
          plugin_stackoverflow: yes
          plugin_stackoverflow_user: ${{ vars.STACKOVERFLOW_USER_ID }}
          plugin_stackoverflow_sections: answers-top, questions-recent
          plugin_stackoverflow_limit: 2
          plugin_stackoverflow_lines: 4
          plugin_stackoverflow_lines_snippet: 2
          template: classic
          theme: tokyonight
          config_timezone: UTC
          output_action: none
          filename: metrics-stackoverflow.svg

      - name: Generate stargazers card
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: OminduD
          base: ""
          plugin_stargazers: yes
          plugin_stargazers_days: 14
          plugin_stargazers_charts_type: chartist
          template: classic
          theme: tokyonight
          config_timezone: UTC
          output_action: none
          filename: metrics-stargazers.svg

      - name: Generate stargazers world map card
        if: ${{ secrets.GOOGLE_MAP_TOKEN != '' }}
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: OminduD
          base: ""
          plugin_stargazers: yes
          plugin_stargazers_charts: no
          plugin_stargazers_worldmap: yes
          plugin_stargazers_worldmap_token: ${{ secrets.GOOGLE_MAP_TOKEN }}
          plugin_stargazers_worldmap_sample: 200
          template: classic
          theme: tokyonight
          config_timezone: UTC
          output_action: none
          filename: metrics-stargazers-worldmap.svg

      - name: Ensure stargazers world map fallback exists
        if: ${{ secrets.GOOGLE_MAP_TOKEN == '' }}
        run: |
          cat > metrics-stargazers-worldmap.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Stargazers worldmap placeholder">
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#1a1b26"/>
                <stop offset="100%" stop-color="#24283b"/>
              </linearGradient>
            </defs>
            <rect width="1200" height="600" fill="url(#bg)"/>
            <text x="60" y="120" fill="#7aa2f7" font-size="48" font-family="Segoe UI, Arial">🌍 Stargazers World Map</text>
            <text x="60" y="200" fill="#c0caf5" font-size="30" font-family="Segoe UI, Arial">Set secret GOOGLE_MAP_TOKEN to enable this card.</text>
            <text x="60" y="255" fill="#9aa5ce" font-size="24" font-family="Segoe UI, Arial">Workflow will auto-replace this placeholder on next run.</text>
          </svg>
          EOF

      - name: Generate recently starred repositories card
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: OminduD
          base: ""
          plugin_stars: yes
          plugin_stars_limit: 6
          template: classic
          theme: tokyonight
          config_timezone: UTC
          output_action: none
          filename: metrics-stars.svg

      - name: Generate reactions card
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: OminduD
          base: ""
          plugin_reactions: yes
          plugin_reactions_limit: 100
          plugin_reactions_details: percentage
          template: classic
          theme: tokyonight
          config_timezone: UTC
          output_action: none
          filename: metrics-reactions.svg

      - name: Ensure Stack Overflow fallback card exists
        if: ${{ vars.STACKOVERFLOW_USER_ID == '' }}
        run: |
          cat > metrics-stackoverflow.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Stack Overflow metrics placeholder">
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#1a1b26"/>
                <stop offset="100%" stop-color="#24283b"/>
              </linearGradient>
            </defs>
            <rect width="1200" height="600" fill="url(#bg)"/>
            <text x="60" y="120" fill="#7aa2f7" font-size="48" font-family="Segoe UI, Arial">🗨️ Stack Overflow Metrics</text>
            <text x="60" y="200" fill="#c0caf5" font-size="30" font-family="Segoe UI, Arial">Set repository variable STACKOVERFLOW_USER_ID to enable this card.</text>
            <text x="60" y="255" fill="#9aa5ce" font-size="24" font-family="Segoe UI, Arial">Workflow will auto-replace this placeholder on next run.</text>
          </svg>
          EOF

      - name: Generate github contribution grid snake animation

        uses: Platane/snk/svg-only@v3

        with:

          github_user_name: OminduD

          outputs: |

            github-snake.svg

            github-snake-dark.svg?palette=github-dark

        env:

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      - name: Commit updated SVGs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(metrics): refresh profile cards"
          file_pattern: "*.svg"
