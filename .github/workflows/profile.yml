name: Generate Profile Animations

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate 3D contribution map
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit 3D contribution graphs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(metrics): update 3D contribution graphs"
          file_pattern: 'profile-3d-contrib/*.svg'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_author: 'github-actions[bot] <github-actions[bot]@users.noreply.github.com>'

      - name: Generate terminal-style overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: OminduD
          base: header, activity, community, repositories, metadata
          template: terminal
          config_timezone: UTC
          filename: metrics-overview.svg
          output_action: none
          extras_css: |
            pre { background: #000000 !important; color: #00ff00 !important; }
            .header { background: #111111 !important; }
            .title { color: #00ff00 !important; }
            .ps1-path { color: #00ff00 !important; }
            .ps1-location { color: #00c800 !important; }
            .banner, footer { color: #00c800 !important; }
            .diff { color: #00ff00 !important; }

      - name: Commit metrics overview
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(metrics): update terminal overview"
          file_pattern: 'metrics-overview.svg'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_author: 'github-actions[bot] <github-actions[bot]@users.noreply.github.com>'
