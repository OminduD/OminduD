name: Generate Animations

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Generate 3D contribution map
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          
      - name: Commit updated SVGs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(metrics): update profile 3D graphics"

      - name: Generate LeetCode card
        continue-on-error: true
        if: ${{ vars.LEETCODE_USER != '' }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: OminduD
          base: ""
          plugin_leetcode: yes
          plugin_leetcode_user: ${{ vars.LEETCODE_USER }}
          plugin_leetcode_sections: solved, skills
          template: classic
          config_timezone: UTC
          output_action: none
          filename: metrics-leetcode.svg

      - name: Generate Stack Overflow card
        continue-on-error: true
        if: ${{ vars.STACKOVERFLOW_USER_ID != '' }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: OminduD
          base: ""
          plugin_stackoverflow: yes
          plugin_stackoverflow_user: ${{ vars.STACKOVERFLOW_USER_ID }}
          plugin_stackoverflow_sections: answers-top
          plugin_stackoverflow_limit: 2
          template: classic
          config_timezone: UTC
          output_action: none
          filename: metrics-stackoverflow.svg


      - name: Generate User Account Overview
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: OminduD
          base: header, activity, community, repositories, metadata
          template: terminal
          config_timezone: UTC
          filename: metrics-overview.svg

      - name: Generate Repository License Overview
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: OminduD
          repo: OminduD
          base: ""
          plugin_licenses: yes
          plugin_licenses_setup: bash -c '[[ -f package.json ]] && npm ci || true'
          plugin_licenses_legal: yes
          plugin_licenses_ratio: yes
          template: terminal
          config_timezone: UTC
          filename: metrics-licenses.svg