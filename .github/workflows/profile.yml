name: Update Profile Assets & Telemetry

on:
  schedule:
    - cron: "0 */6 * * *" # Every 6 hours
  workflow_dispatch: # Allow manual trigger
  push:
    branches: ["main"]
    paths:
      - 'scripts/**'
      - '.github/workflows/profile.yml'

concurrency:
  group: profile-update-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends librsvg2-bin ffmpeg

      - name: Generate 3D contribution map
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Retain only profile-night-green 3D contribution theme
        run: |
          find profile-3d-contrib -type f ! -name 'profile-night-green.svg' -delete

      - name: Generate space shooter game GIF
        uses: czl9707/gh-space-shooter@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: 'game.gif'
          strategy: 'random'

      - name: Frame space shooter game in Cyber Terminal
        run: node scripts/frame-space-game.mjs

      - name: Update live telemetry, space calendar & whoami
        run: node scripts/build-intel-and-headers.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update repository project summary
        run: node scripts/update-projects.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push profile updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(profile): 🤖 update live stats, 3D mesh, space drill & telemetry [skip ci]"
          file_pattern: 'profile-3d-contrib/profile-night-green.svg game.gif assets/*.svg assets/*.png scripts/contributions-cache.json .github/project-summary.json'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_author: 'github-actions[bot] <github-actions[bot]@users.noreply.github.com>'
