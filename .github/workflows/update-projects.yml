name: Auto-Update Projects Documentation

on:
  schedule:
    - cron: "0 0 * * 0"     # Run every Sunday at midnight UTC
  workflow_dispatch:         # Allow manual trigger
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/update-projects.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  update-projects:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install PyGithub requests python-dateutil

      - name: Update PROJECTS.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: OminduD
        run: |
          python3 << 'EOF'
          import os
          import json
          import requests
          from datetime import datetime
          from dateutil.parser import parse

          # Get environment variables
          token = os.environ.get('GITHUB_TOKEN')
          username = os.environ.get('GITHUB_USERNAME', 'OminduD')

          headers = {
              'Authorization': f'token {token}',
              'Accept': 'application/vnd.github.v3+json'
          }

          # Fetch all repositories
          repos = []
          page = 1
          while True:
              url = f'https://api.github.com/users/{username}/repos?per_page=100&page={page}&sort=created&direction=asc'
              response = requests.get(url, headers=headers)
              if response.status_code != 200:
                  print(f"Error fetching repos: {response.status_code}")
                  break

              data = response.json()
              if not data:
                  break

              repos.extend(data)
              page += 1

          print(f"Found {len(repos)} repositories")

          # Update repository counts in PROJECTS.md
          with open('docs/PROJECTS.md', 'r', encoding='utf-8') as f:
              content = f.read()

          # Count repositories
          public_count = sum(1 for r in repos if not r['private'])
          private_count = sum(1 for r in repos if r['private'])
          total_count = len(repos)

          print(f"Public: {public_count}, Private: {private_count}, Total: {total_count}")

          # Update the statistics section with actual counts
          import re

          # Update project statistics
          stats_pattern = r'\| \*\*Total Repositories\*\* \|.*?\| 100% \|'
          stats_replacement = f'| **Total Repositories** | ![Total](https://img.shields.io/badge/Total-{total_count}-82aaff?style=flat-square) | 100% |'
          content = re.sub(stats_pattern, stats_replacement, content)

          # Calculate percentages
          public_pct = round((public_count / total_count * 100)) if total_count > 0 else 0
          private_pct = round((private_count / total_count * 100)) if total_count > 0 else 0

          public_pattern = r'\| \*\*Public Projects\*\* \|.*?\| ~?\d+% \|'
          public_replacement = f'| **Public Projects** | ![Public](https://img.shields.io/badge/Public-{public_count}-success?style=flat-square) | ~{public_pct}% |'
          content = re.sub(public_pattern, public_replacement, content)

          private_pattern = r'\| \*\*Private Projects\*\* \|.*?\| ~?\d+% \|'
          private_replacement = f'| **Private Projects** | ![Private](https://img.shields.io/badge/Private-{private_count}-red?style=flat-square) | ~{private_pct}% |'
          content = re.sub(private_pattern, private_replacement, content)

          # Write updated content
          with open('docs/PROJECTS.md', 'w', encoding='utf-8') as f:
              f.write(content)

          print("✅ PROJECTS.md updated successfully!")

          # Create a summary file
          summary = {
              'updated_at': datetime.utcnow().isoformat(),
              'total_repos': total_count,
              'public_repos': public_count,
              'private_repos': private_count,
              'repositories': [
                  {
                      'name': repo['name'],
                      'private': repo['private'],
                      'language': repo['language'],
                      'created_at': repo['created_at'],
                      'updated_at': repo['updated_at'],
                      'stars': repo['stargazers_count'],
                      'forks': repo['forks_count']
                  }
                  for repo in repos
              ]
          }

          with open('.github/project-summary.json', 'w', encoding='utf-8') as f:
              json.dump(summary, f, indent=2)

          print("✅ Project summary created!")
          EOF

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto-update PROJECTS.md with latest repository data"
          branch: main
          file_pattern: 'docs/PROJECTS.md .github/project-summary.json'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_author: 'github-actions[bot] <github-actions[bot]@users.noreply.github.com>'

      - name: Create summary
        run: |
          echo "### 📊 Projects Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ PROJECTS.md has been updated with the latest repository data" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f .github/project-summary.json ]; then
            echo "📈 Repository Statistics:" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat .github/project-summary.json | head -20 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
