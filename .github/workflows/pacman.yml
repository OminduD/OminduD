name: Generate Pacman Animation

on:
  schedule:
    - cron: "0 */12 * * *"  # Execute every 12 hours
  workflow_dispatch:        # Allow manual trigger
  push:
    branches: ["main"]

permissions:
  contents: write           # Required to push to output branch

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10     # Prevent workflow from running too long

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Pacman contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: OminduD
          # Generates both light and dark mode SVGs

      - name: Push Pacman graph to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update Pacman contribution graph"
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
