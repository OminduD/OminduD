name: Generate Pacman Animation

on:
  schedule:
    - cron: "0 */12 * * *"  # Execute every 12 hours
  workflow_dispatch:        # Allow manual trigger
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/pacman.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Pacman contribution graph
        uses: abozanona/pacman-contribution-graph@v1.2.1
        with:
          github_user_name: OminduD
          github_token: ${{ secrets.GITHUB_TOKEN }}
          output_file_path: output/pacman-contribution-graph.svg

      - name: Push graphs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: output
          commit_message: "🤖 Update Pacman contribution graph"
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
