name: Generate Profile Stats

on:
  schedule:
    - cron: '0 0 * * *'     # Runs at 00:00 UTC every day
  workflow_dispatch:        # Allows manual trigger
  push:
    branches:
      - main
    paths:
      - '.github/workflows/profile-stats.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Snake Game from contributions
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: OminduD
          outputs: |
            dist/pacman-contribution-graph.svg
            dist/pacman-contribution-graph-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Generate language stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: OminduD
          base: ""
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 10
          plugin_languages_sections: most-used, recently-used
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 60
          plugin_languages_categories: programming
          plugin_languages_recent_load: 1000
          plugin_languages_recent_days: 365
          repositories_batch: 100
          output_action: commit
          filename: dist/language-stats.svg
          committer_branch: output
          committer_message: "Update language statistics"
        continue-on-error: true

      - name: Push changes to output branch
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Update contribution graphs and language statistics"
          branch: output
          create_branch: true
          file_pattern: 'dist/*.svg'
          push_options: '--force'
          skip_fetch: true
          skip_checkout: true
        continue-on-error: true
