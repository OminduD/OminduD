<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Stack Overflow placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1b26"/>
      <stop offset="100%" stop-color="#24283b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <text x="60" y="120" fill="#7aa2f7" font-size="48" font-family="Segoe UI, Arial">🗨️ Stack Overflow Metrics</text>
  <text x="60" y="200" fill="#c0caf5" font-size="30" font-family="Segoe UI, Arial">Set STACKOVERFLOW_USER_ID repo variable to enable live data.</text>
  <text x="60" y="255" fill="#9aa5ce" font-size="24" font-family="Segoe UI, Arial">This file will be auto-updated by GitHub Actions.</text>
</svg>
